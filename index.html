    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #16b8cf url('Untitled%20design.png') center center / cover no-repeat fixed;
            
        }

        .start-menu-button {
  position: relative;
  width: 6em;
  height: 6em;
  border-radius: 50%;
  border: 0;
  background: linear-gradient(#2e3c87, #24b8e8);
          animation: start-menu-spin 20s ease-in-out infinite;
}

        @keyframes start-menu-spin {
          0%, 100% {
            transform: rotate(0deg);
          }

          6% {
            transform: rotate(360deg);
          }

          12% {
            transform: rotate(0deg);
          }
        }

.start-menu-prompt {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75em;
  margin-top: 1em;
  color: rgb(5, 64, 143);
  font-weight: 700;
}

.start-menu-inner {
  cursor: pointer;
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 50% 100%,
    #30f8f8 10%,
    #28cff1 30%,
    #2d6284 60%,
    #2c517b
  );
}

.top-white {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(#fffe, #fff0 60%),
    radial-gradient(circle at 50% 2%, #fff5, #fff5 7%, #fff0 50%);
  clip-path: url(#top-clip);
}

.colors {
  position: absolute;
  inset: 0;
  filter: blur(4px);
}

.red {
  position: absolute;
  bottom: 50%;
  right: 50%;
  width: 4em;
  height: 4em;
  background: linear-gradient(190deg, #f00 15%, #f004 40%, #0000),
    linear-gradient(80deg, #f00 15%, #f004 40%, #0000),
    linear-gradient(#0f0, #0f0);
  filter: url(#red-filter);
  rotate: 13deg;
  transform-origin: 100% 100%;
}

.green {
  position: absolute;
  bottom: 50%;
  right: 50%;
  width: 4em;
  height: 4em;
  background: linear-gradient(200deg, #f00 15%, #f004 40%, #0000),
    linear-gradient(70deg, #f00 15%, #f004 40%, #0000),
    linear-gradient(#0f0, #0f0);
  filter: url(#green-filter);
  rotate: 103deg;
  transform-origin: 100% 100%;
}

.blue {
  position: absolute;
  bottom: 50%;
  right: 50%;
  width: 4.25em;
  height: 4.25em;
  background: linear-gradient(190deg, #f00 15%, #f004 40%, #0000),
    linear-gradient(65deg, #f00 20%, #f004 45%, #0000),
    linear-gradient(#0f0, #0f0);
  filter: url(#blue-filter);
  rotate: 283deg;
  transform-origin: 100% 100%;
}

.yellow {
  position: absolute;
  bottom: 50%;
  right: 50%;
  width: 4em;
  height: 4em;
  background: linear-gradient(190deg, #f00 15%, #f004 40%, #0000),
    linear-gradient(80deg, #f00 15%, #f004 40%, #0000),
    linear-gradient(#0f0, #0f0);
  filter: url(#yellow-filter);
  rotate: 193deg;
  transform-origin: 100% 100%;
}

.colors {
  opacity: 0;
  transition: 0.5s opacity;
}

.start-menu-button:hover .colors {
  opacity: 1;
}

.start-menu-button:active .colors {
  opacity: 0.65;
}

.inner {
  position: relative;
  inset: 0px;
  padding: 1em;
  border-radius: 4px;
  background: radial-gradient(circle at 50% 100%, #30f8f8 10%, #30f8f800 55%),
    linear-gradient(#00526a, #009dcd);
  overflow: hidden;
  transition: inherit;
}

.inner::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(-65deg, #0000 40%, #fff7 50%, #0000 70%);
  background-size: 200% 100%;
  background-repeat: no-repeat;
  animation: thing 3s ease infinite;
}

@keyframes thing {
  0% {
    background-position: 130%;
    opacity: 1;
  }

  to {
    background-position: -166%;
    opacity: 0;
  }
}

.top-white {
  position: absolute;
  border-radius: inherit;
  inset: 0 -8em;
  background: radial-gradient(
    circle at 50% -270%,
    #fff 45%,
    #fff6 60%,
    #fff0 60%
  );
  transition: inherit;
}

.inner::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  transition: inherit;
  box-shadow: inset 0px 2px 8px -2px #0000;
}

.frutiger-button:active .inner::after {
  box-shadow: inset 0px 2px 8px -2px #000a;
}

.text {
  position: relative;
  z-index: 1;
  color: white;
  font-weight: 550;
  transition: inherit;
}
