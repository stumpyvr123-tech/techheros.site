<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guides | TechHero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body class="site-page">
    <style>
        body.site-page {
            box-sizing: border-box;
            min-height: 100vh;
            margin: 0;
            padding: clamp(1rem, 4vw, 3rem);
            color: #edf9ff;
            font-family: 'Montserrat', sans-serif;
            background:
              radial-gradient(circle at top, rgba(117, 178, 226, 0.3), transparent 38%),
              linear-gradient(180deg, #0a1721 0%, #102534 30%, #183244 100%);
        }

        h1 {
            font-size: clamp(2.2rem, 4vw, 4rem);
            text-align: center;
            color: #edf9ff;
            text-shadow: none;
            margin-bottom: 30px;
            letter-spacing: -0.04em;
        }

        p {
            text-align: center;
            color: #edf9ff;
            font-size: 1.1rem;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 28px auto 0;
            text-decoration: none;
            border-radius: 999px;
            padding: 4px;
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.46);
            box-shadow: 0 8px 18px rgba(24, 54, 78, 0.08), inset 0 1px 0 rgba(255,255,255,0.82);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .back-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(24, 54, 78, 0.12), inset 0 1px 0 rgba(255,255,255,0.82);
        }

        .back-button .inner {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 150px;
            padding: 11px 20px;
            border-radius: 999px;
            background: rgba(255,255,255,0.13);
            border: 1px solid rgba(255,255,255,0.26);
            overflow: hidden;
        }

        .back-button .inner::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(255,255,255,0.3), rgba(255,255,255,0.02) 35%, rgba(255,255,255,0) 65%);
            pointer-events: none;
        }

        .back-button .text {
            position: relative;
            z-index: 1;
            color: #1a2e42;
            font-weight: 700;
            letter-spacing: 0.02em;
            font-size: 0.95rem;
        }
    </style>
    <h1>Tech Guides</h1>
    <p>Guides coming soon.</p>
    <a class="frutiger-button back-button" href="index.html"><div class="inner"><span class="text">Back to home</span></div></a>
</body>
</html>
