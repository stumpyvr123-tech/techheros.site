<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Hero Navigation</title>
    <link rel="stylesheet" href="site.css">
</head>
<body class="site-page start-menu-page">
  <main class="navigation-panel">
    <header class="navigation-heading">
      <h1>Tech Hero</h1>
      <p>Site Navigation</p>
    </header>

    <div class="navigation-columns">
      <section class="navigation-section" aria-labelledby="programs-heading">
        <h2 id="programs-heading">Explore</h2>
        <a href="news.html" class="frutiger-button custom-app-btn"><div class="inner"><div class="top-white"></div><span class="text">News</span></div></a>
        <a href="guides.html" class="frutiger-button custom-app-btn"><div class="inner"><div class="top-white"></div><span class="text">Guides</span></div></a>
        <a href="reviews.html" class="frutiger-button custom-app-btn"><div class="inner"><div class="top-white"></div><span class="text">Reviews</span></div></a>
        <a href="info.html" class="frutiger-button custom-app-btn"><div class="inner"><div class="top-white"></div><span class="text">Site Information</span></div></a>
      </section>

      <nav class="navigation-section navigation-links" aria-label="Site links">
        <h2>Information</h2>
        <a href="disclaimer.html" class="frutiger-button custom-app-btn"><div class="inner"><div class="top-white"></div><span class="text">Disclaimer</span></div></a>
        <a href="TOS.html" class="frutiger-button custom-app-btn"><div class="inner"><div class="top-white"></div><span class="text">Terms of service</span></div></a>
        <a href="404.html" class="frutiger-button custom-app-btn"><div class="inner"><div class="top-white"></div><span class="text">Error page</span></div></a>
      </nav>
    </div>

  </main>

  <a class="frutiger-button back-button" href="index.html"><div class="inner"><div class="top-white"></div><span class="text">Back to home</span></div></a>

  <style>
    .start-menu-page {
      display: grid;
      place-items: center;
      padding: 1rem;
      overflow: hidden;
    }

    .navigation-panel {
      width: min(680px, calc(100vw - 2rem));
      color: #073653;
      background: linear-gradient(135deg, rgba(236, 253, 255, 0.92), rgba(82, 190, 230, 0.86));
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      box-shadow: 0 14px 35px rgba(0, 35, 70, 0.48), inset 0 1px rgba(255, 255, 255, 0.9), inset 0 -2px rgba(0, 75, 130, 0.22);
      backdrop-filter: blur(18px) saturate(135%);
      -webkit-backdrop-filter: blur(18px) saturate(135%);
      overflow: hidden;
    }

    .navigation-heading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      min-height: 4.5rem;
      padding: 0.7rem 1rem;
      color: white;
      background: linear-gradient(rgba(0, 105, 175, 0.82), rgba(49, 187, 229, 0.48));
      border-bottom: 1px solid rgba(255, 255, 255, 0.55);
      text-shadow: 1px 1px #03436d;
    }

    .navigation-heading h1,
    .navigation-heading p,
    .navigation-columns h2 {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
    }

    .navigation-heading h1 {
      font-size: 1.15rem;
    }

    .navigation-heading p {
      font-size: 0.75rem;
      opacity: 0.9;
    }

    .navigation-columns {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 0;
      min-height: 315px;
      padding: 0.8rem;
      background: rgba(245, 253, 255, 0.5);
    }

    .navigation-columns h2 {
      margin: 0 0 0.55rem;
      color: #07507d;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .navigation-section {
      display: grid;
      align-content: start;
      gap: 0.55rem;
      padding: 0.65rem;
    }

    .navigation-section:first-child {
      border-right: 1px solid rgba(255, 255, 255, 0.8);
    }

    .navigation-links {
      background: rgba(42, 133, 190, 0.18);
    }

    .start-menu-page .custom-app-btn {
      width: 100%;
      box-sizing: border-box;
      font-size: 0.82rem;
      text-align: left;
    }

    .start-menu-page .custom-app-btn .inner {
      padding: 0.65rem 0.8rem;
    }

    .start-menu-page > .back-button {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      margin: 0;
    }

    @media (max-width: 560px) {
      .navigation-columns {
        grid-template-columns: 1fr;
        max-height: 70vh;
        overflow-y: auto;
      }

      .navigation-section:first-child {
        border-right: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      }
    }
  </style>
</body>
</html>
